SYM _dx : real


ALG num1
SPEC num1 : NIN(_dx,_B) I(_N,_K,_A,_B)=I(_N,_K,Sub(_A,_B,_dx),_dx)

ALG calc
SPEC calc : I(_N,_K,_A,_dx)=_erg DO {_myerg=0 FOR i=_N TO _K STEP _step DO { _dx=i \
_tmp1=_A _dx=i+_step _tmp1=_tmp1+_A _myerg=_myerg+_step*_tmp1/2} _dx=dummy }

ALG numerik
SPEC numerik : (num1,Subst)
