# Init-File : Numerisches Loesen von expliziten Diff-gleichungen
# Eingabe : f(x,y) = y'
# x0 = Anfangswert x (normal : == 0)
# y0 = Anfangswert y
# dx = Schrittweite x

TERM f,n,D0,D1,D2,D3,TAY  : real
SYM x0,xmax,y0,dx,k1,k2,k3,k4,d0,d1,d2,d3,tiefe : real

ALG ERSDY
SPEC ERSDY : D(y,x)=f

ALG DIFFGLSUB
SPEC    DIFFGLSUB : Dp(y,x) = d1
ADDSPEC DIFFGLSUB : D(y,x) = d1
ADDSPEC DIFFGLSUB : Dp(d1,x) = d2
ADDSPEC DIFFGLSUB : D(d1,x) = d2
ADDSPEC DIFFGLSUB : Dp(d2,x) = d3
ADDSPEC DIFFGLSUB : D(d2,x) = d3

# Bsp. :

f=2*y+x
x0=0
xmax=1
y0=1
dx=.2
tiefe=2

